<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Security Policy Violation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .error-container {
            background-color: #fff3f3;
            border: 1px solid #ffa7a7;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>Content Security Policy Violation</h1>
    <p>A resource was blocked due to Content Security Policy restrictions.</p>
    <p>If you believe this is an error, please contact the site administrator.</p>
</div>
</body>
</html>
